  if(AUTHERR){MODE="login";V.lerr=AUTHERR;return render()}
  if(AUTHFLOW){MODE="agency";const s=sb&&await sb.auth.getSession();if(!(s&&s.data&&s.data.session)){AUTHFLOW=null;MODE="login";V.lerr="Ce lien a expiré ou a déjà été utilisé. Entrez votre email ci-dessous puis cliquez sur « Mot de passe oublié ».";history.replaceState(null,"",location.pathname)}return render()}
  if(FROMLINK||(L.code&&!sb)){MODE="player";render();return playerSync(true)}
  if(sb){const {data}=await sb.auth.getSession();if(data&&data.session){MODE="agency";return agencyLoad()}}
  if(H.has("agence")){MODE="login";return render()}
  if(L.code){MODE="player";render();return playerSync(true)}
  MODE=L.mode==="agency"?"login":"home";render()}

async function playerSync(load){
  if(!sb){V.pmsg="Connexion au serveur impossible pour le moment. Tes saisies sont gardées sur ce téléphone.";return render()}
  // envoie la file d'attente
  while(L.queue.length){const op=L.queue[0];
    try{const r=op.op==="req"?await sb.rpc("player_request",{p_token:L.code,r:op.r}):op.op==="save"?await sb.rpc("player_save_entry",{p_token:L.code,e:op.e}):op.op==="del"?await sb.rpc("player_delete_entry",{p_token:L.code,p_id:op.id}):await sb.rpc("player_save_self",{p_token:L.code,p_self:op.self,p_consent:op.consent});
      if(r.error){if(/code invalide/.test(r.error.message)){V.pbad=true;break}if(isNetErr(r.error))break;console.error(r.error);L.queue.shift();save();continue}
      L.queue.shift();save()}catch(e){break}}
  if(load||!L.cache){try{const r=await sb.rpc("player_get",{p_token:L.code});
      if(r.error)throw r.error;if(r.data===null){V.pbad=true}else{const pend=L.queue.filter(o=>o.op==="save").map(o=>o.e),del=L.queue.filter(o=>o.op==="del").map(o=>o.id);
        let E=(r.data.entries||[]).filter(e=>!del.includes(e.id));pend.forEach(p=>{const i=E.findIndex(x=>x.id===p.id);if(i>=0)E[i]=p;else E.unshift(p)});
        if($("#fd"))V.draft=readForm();
        const pr=L.queue.filter(o=>o.op==="req").map(o=>({...o.r,status:"pending"}));
        L.cache={name:r.data.name,self:r.data.self||{},consent_at:r.data.consent_at||(L.cache&&L.cache.consent_at),entries:E,requests:pr.concat(r.data.requests||[])};V.pbad=false;save()}}
    catch(e){if(!isNetErr(e))console.error(e)}}
  render()}

const hello=()=>{const h=new Date().getHours();return h<6?"Bonne nuit":h<12?"Bonjour":h<18?"Bon après-midi":"Bonsoir"};
function streak(E){const W=new Set(E.map(e=>wk(e.date)));let n=0,d=Date.parse(wk(today()));if(!W.has(wk(today())))d-=7*864e5;while(W.has(new Date(d).toISOString().slice(0,10))){n++;d-=7*864e5}return n}
function reqCard(c){const R=(c.requests||[]).find(q=>q.status!=="done");
  if(!R)return`<div class="card row" style="align-items:center;justify-content:space-between"><span><b>Besoin de parler ?</b> <span class="mut">Ton responsable est là pour toi.</span></span><button class="g" data-act="rqopen">🙋 Demander un RDV</button></div>`;
  return`<div class="banner">${R.status==="scheduled"?`<b>📅 Rendez-vous fixé : ${esc(fmtDT(R.appt_at))}</b>`:R.status==="pending"?`<b>📶 Demande de RDV enregistrée</b> <span class="mut">· envoi dès que le réseau revient</span>`:`<b>🙋 Demande de RDV envoyée</b> <span class="mut">· ton responsable va te recontacter</span>`}
  <div class="sm" style="margin-top:4px">${esc(R.reason)}${R.pref?" · "+esc(R.pref):""}</div>${R.agency_note?`<div class="sm" style="margin-top:4px">💬 <i>« ${esc(R.agency_note)} »</i></div>`:""}</div>`}
function reqDlg(reason){dlg(`<h3 style="margin-bottom:4px">🙋 Parler à mon responsable</h3><p class="mut sm" style="margin-top:0">Ta demande arrive directement à l’agence. Tu seras recontacté.</p>
  <div class="lab" style="font-weight:600;margin:10px 0 6px">C’est à propos de…</div><div class="row" style="gap:6px" id="rq-r">${RQ_REASONS.map(x=>`<button type="button" class="g sm${x===reason?" on":""}" data-rr="${esc(x)}" style="${x===reason?"background:var(--ink);color:var(--bg)":""}">${x}</button>`).join("")}</div>
  <div class="lab" style="font-weight:600;margin:14px 0 6px">Je préfère…</div><div class="seg" id="rq-p">${RQ_PREFS.map((x,i)=>`<button type="button" data-rp="${esc(x)}" class="${i===0?"on":""}">${x}</button>`).join("")}</div>
  <label class="f">Quand es-tu disponible ?<input id="rq-s" maxlength="200" placeholder="Ex. ce soir après 18h, mercredi après-midi…"></label>
  <label class="f" style="margin-top:10px">Ton message (facultatif)<textarea id="rq-m" maxlength="1000" placeholder="Explique en quelques mots si tu veux."></textarea></label>
  <p id="rq-err" class="sm" style="font-weight:600;min-height:18px;margin:8px 0"></p><div class="row" style="justify-content:flex-end"><button class="g" onclick="closeDlg()">Annuler</button><button class="b" id="rq-ok">Envoyer la demande</button></div>`);
  let rr=reason||"",rp=RQ_PREFS[0];
  $("#rq-r").onclick=e=>{const b=e.target.closest("[data-rr]");if(!b)return;rr=b.dataset.rr;$("#rq-r").querySelectorAll("button").forEach(x=>{const on=x===b;x.style.background=on?"var(--ink)":"";x.style.color=on?"var(--bg)":""})};
  $("#rq-p").onclick=e=>{const b=e.target.closest("[data-rp]");if(!b)return;rp=b.dataset.rp;$("#rq-p").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))};
  $("#rq-ok").onclick=async()=>{if(!rr){$("#rq-err").textContent="Choisis le sujet.";return}
    const r={id:uuid(),reason:rr,pref:rp,slots:$("#rq-s").value.trim(),message:$("#rq-m").value.trim(),created_at:new Date().toISOString()};
    L.queue.push({op:"req",r});L.cache.requests=[{...r,status:"pending"}].concat(L.cache.requests||[]);save();closeDlg();render();await playerSync(true);
    toast(L.queue.some(o=>o.op==="req"&&o.r.id===r.id)?"Demande enregistrée · envoi dès que le réseau revient":"Demande envoyée à ton responsable ✓")}}
function cheer(e,offline){const m=e.goals?`⚽ Bravo pour ${e.goals>1?"tes "+e.goals+" buts":"ton but"} ! ${e.inj?"Et prends soin de toi 🙏":"Continue comme ça 🔥"}`:e.assists&&!e.inj?`🅰️ Belle passe décisive ! Continue comme ça 🔥`:e.inj?"Prends soin de toi 🙏 L’agence est prévenue.":e.moral&&e.moral<=2?"Courage 💪 L’agence est là si tu veux en parler.":e.form&&e.form<=2?"Pense à bien récupérer 😴":e.feel>=4||e.form>=4?"Continue comme ça 🔥":"Merci, c’est bien noté 👍";
  dlg(`<span class="big">${offline?"📶":"✅"}</span><h2 style="text-align:center">${offline?"Enregistré":"Envoyé à l’agence !"}</h2><p style="text-align:center;margin:8px 0 4px">${m}</p>${offline?'<p class="sm mut" style="text-align:center">Pas de réseau : l’envoi se fera automatiquement dès qu’il revient.</p>':""}${(e.inj||(e.moral&&e.moral<=2)||e.form===1)?`<button class="g wide" style="margin-top:12px" id="ch-rq">🙋 Demander un RDV avec mon responsable</button>`:""}<button class="b wide" style="margin-top:12px" onclick="closeDlg()">OK</button>`);clearTimeout(cheer.t);
  const rb=$("#ch-rq");if(rb){rb.onclick=()=>{clearTimeout(cheer.t);reqDlg(e.inj?RQ_REASONS[1]:RQ_REASONS[0])}}else cheer.t=setTimeout(closeDlg,3500)}
const stepper=(k,l,v)=>`<div class="step"><span>${l}</span><div class="ctl"><button type="button" data-st="${k}" data-d="-1" aria-label="Moins">−</button><b id="st-${k}">${v||0}</b><button type="button" data-st="${k}" data-d="1" aria-label="Plus">+</button></div></div>`;

      closeDlg();V.sel=null;toast(p.name+" a été supprimé");render()};return}
  case"gv0":V.gv=false;return render();
  case"gv1":V.gv=true;return render();
  case"invite":return inviteDlg(DB.players.find(x=>x.id===V.sel));
  case"fsave":{const p=DB.players.find(x=>x.id===V.sel),info={...(p.info||{})};let name=p.name;
    document.querySelectorAll("[data-fk]").forEach(i=>{if(i.dataset.fk==="name")name=i.value.trim()||name;else info[i.dataset.fk]=i.value.trim()});
    const r=await sb.from("players").update({name,info,updated_at:new Date().toISOString()}).eq("id",p.id).select().single();if(r.error)return toast("Erreur : "+r.error.message);
    Object.assign(p,r.data);V.dirty=false;toast("Fiche enregistrée");return render()}
  case"rmphoto":{const p=DB.players.find(x=>x.id===V.sel),info={...p.info};delete info.photo;const r=await sb.from("players").update({info}).eq("id",p.id).select().single();if(!r.error)Object.assign(p,r.data);return render()}
  case"note":{const v=$("#nt").value.trim();if(!v)return;const r=await sb.from("notes").insert({player_id:V.sel,author:L.me||V.email||"",text:v}).select().single();if(r.error)return toast("Erreur : "+r.error.message);DB.notes.unshift(r.data);return render()}
  case"csv":{const rows=[["Joueur","Téléphone","Catégorie","Poste","Âge","Club","Responsable","Date","Type","Adversaire","Rôle","Minutes","Buts","Passes déc.","Ressenti","Forme","Moral","Blessure","Zone","Commentaire","Retour coach"]];
    DB.entries.forEach(e=>{const p=DB.players.find(x=>x.id===e.player_id);if(!p)return;rows.push([p.name,pv(p,"tel"),pv(p,"categorie"),pv(p,"poste"),age(pv(p,"birth"))??"",pv(p,"club"),pv(p,"resp"),e.date,e.kind==="entrainement"?"Entraînement":"Match",e.opp,e.role,e.min,e.kind==="entrainement"?"":e.goals||0,e.kind==="entrainement"?"":e.assists||0,e.feel||"",e.form||"",e.moral||"",INJ[e.inj||0],e.zone,e.note,e.coach||""])});
    const csv="﻿"+rows.map(r=>r.map(v=>{v=String(v==null?"":v);return/[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(";")).join("\r\n");
    const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));l.download="dgxa-saisies-"+today()+".csv";document.body.appendChild(l);l.click();l.remove();return}
  }
});
document.addEventListener("change",async ev=>{const i=ev.target;
  if(i.id==="fr"){V.draft=readForm();V.draft.role=i.value;return render()}
  if(i.id==="flt"){V.f=i.value;return render()}
  if(i.id==="srt"){V.sort=i.value;return render()}
  if(i.id==="grp"){V.grp=i.value;return render()}
  if(i.dataset&&i.dataset.fk){V.dirty=true;const m=$("#fsm");if(m)m.textContent="Modifications non enregistrées"}
  if(i.id==="photo"&&i.files[0]){try{const url=await resize(i.files[0]);const p=DB.players.find(x=>x.id===V.sel),info={...(p.info||{}),photo:url};
    const r=await sb.from("players").update({info}).eq("id",p.id).select().single();if(r.error)throw r.error;Object.assign(p,r.data);render()}catch(e){toast("Photo impossible : "+(e.message||e))}}
});
document.addEventListener("input",ev=>{if(ev.target.id==="q"){V.q=ev.target.value;const pos=ev.target.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(pos,pos)}});
function showTip(g,x,y){const t=$("#tip"),[h,...r]=g.dataset.tip.split("|");t.innerHTML="<b>"+esc(h)+"</b>"+r.map(esc).join("<br>");document.querySelectorAll(".hitg.on").forEach(e=>e.classList.remove("on"));g.classList.add("on");
  t.classList.add("on");const W=t.offsetWidth,Hh=t.offsetHeight;t.style.left=Math.max(8,Math.min(innerWidth-W-8,x-W/2))+"px";t.style.top=Math.max(8,y-Hh-14)+"px"}
function hideTip(){$("#tip").classList.remove("on");document.querySelectorAll(".hitg.on").forEach(e=>e.classList.remove("on"))}
document.addEventListener("pointermove",ev=>{const g=ev.target.closest&&ev.target.closest(".hitg");if(g&&ev.pointerType==="mouse")showTip(g,ev.clientX,ev.clientY);else if(!g&&ev.pointerType==="mouse")hideTip()});
document.addEventListener("pointerdown",ev=>{const g=ev.target.closest&&ev.target.closest(".hitg");if(g&&ev.pointerType!=="mouse"){showTip(g,ev.clientX,ev.clientY);clearTimeout(hideTip.t);hideTip.t=setTimeout(hideTip,2500)}else if(!g)hideTip()});
addEventListener("scroll",hideTip,{passive:true});
document.addEventListener("keydown",ev=>{if(ev.key!=="Enter")return;const id=ev.target.id;if(id==="code")$("[data-act=joincode]").click();if(id==="lp")$("[data-act=login]").click()});
boot();
</script>
</body>
</html>
