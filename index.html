<html lang="fr">
<head>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(barlow-condensed-latin-700-normal.woff2) format("woff2")}
:root{--bg:#F3F3F3;--sf:#fff;--ink:#000;--mut:#6A6A6A;--line:#DCDCDC;--soft:#EDEDED}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#000;--sf:#111;--ink:#fff;--mut:#9A9A9A;--line:#2A2A2A;--soft:#1C1C1C}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Barlow",system-ui,sans-serif;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:0;letter-spacing:.2px}
h2{font-size:26px}h3{font-size:19px}
header{background:#000;color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #ffffff22;position:sticky;top:0;z-index:5}
header .brand{display:flex;align-items:center;gap:12px}header img{height:24px;display:block}
header .brand span{font:700 20px "Barlow Condensed",sans-serif}
header button{background:none;border:1px solid #ffffff55;color:#fff;border-radius:999px;padding:6px 12px;font:500 13px "Barlow",sans-serif;cursor:pointer}
main{max-width:1000px;margin:0 auto;padding:18px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px #0000000a,0 10px 30px #0000000a}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
button{transition:transform .08s ease,background .15s,opacity .15s}button:active{transform:scale(.96)}
.emo{font-size:20px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.hero{background:#000;color:#fff;border-radius:22px;padding:20px;margin-bottom:14px}
.hero h2{font-size:30px}.hero .pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hero .pill{background:#ffffff1f;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.big{font-size:64px;line-height:1;animation:pop .45s ease both;display:block;text-align:center;margin:6px 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.grow{flex:1}
label.f{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:4px;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
textarea{min-height:76px;resize:vertical}
input[type=checkbox]{width:auto}
.b{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:12px 20px;font:600 15px "Barlow",sans-serif;cursor:pointer}
.b[disabled]{opacity:.4}
.g{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 14px;font:500 14px "Barlow",sans-serif;cursor:pointer;white-space:nowrap}
.g.sm{padding:5px 11px;font-size:13px}
.wide{width:100%}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mut{color:var(--mut)}.sm{font-size:13px}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--ink);margin:2px 4px 2px 0;white-space:nowrap}
.tag.hi{background:var(--ink);color:var(--bg)}.tag.ok{border-style:dashed;color:var(--mut);border-color:var(--mut)}
/* jauges */
.gauge{display:inline-flex;gap:3px;vertical-align:middle;font-size:0}
.gauge i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block}
.gauge i.on{background:var(--ink)}
.gl{display:grid;grid-template-columns:auto auto 1fr;gap:4px 10px;align-items:center;font-size:13px}
.gl .mut{white-space:nowrap}
.gin{margin:4px 0 14px}.gin .lab{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}.gin .lab b{font-weight:600}
.gin .dots{display:flex;gap:8px}
.gin .dots button{flex:1;height:58px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-size:30px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;color:var(--ink)}
.gin .dots button:hover{border-color:var(--ink)}
.gin .dots.has button:not(.on){filter:grayscale(1);opacity:.45}
.gin .dots button.on{border:2.5px solid var(--ink);background:var(--sf);transform:scale(1.08);box-shadow:0 6px 16px #00000022}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;padding:11px 6px;background:var(--sf);border:0;border-right:1.5px solid var(--ink);font:600 14px "Barlow",sans-serif;color:var(--ink);cursor:pointer}
.seg button:last-child{border-right:0}.seg button.on{background:var(--ink);color:var(--bg)}
/* liste joueurs */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.pc{background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 1px 2px #0000000a,0 10px 30px #0000000a;cursor:pointer;display:flex;flex-direction:column;gap:10px;text-align:left;font:inherit;color:inherit}
.pc:hover{border-color:var(--ink);transform:translateY(-2px)}
.pc.alert{border:2px solid var(--ink)}
.ph{display:flex;gap:12px;align-items:center}
.av{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font:700 18px "Barlow Condensed",sans-serif;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.xl{width:84px;height:84px;font-size:32px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 1px 2px #0000000a,0 10px 30px #0000000a}
.kpi i{font-style:normal;font-size:20px;float:right}
.kpi b{display:block;font:700 30px "Barlow Condensed",sans-serif;line-height:1.1}.kpi span{font-size:13px;color:var(--mut)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:var(--sf);color:var(--ink);border-radius:999px;padding:8px 16px;font:600 14px "Barlow",sans-serif;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sp{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.ent{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
.ent:first-child{border-top:0;padding-top:0}
.empty{padding:28px;text-align:center;color:var(--mut)}
.banner{border:2px solid var(--ink);border-radius:14px;padding:12px 14px;margin-bottom:14px;background:var(--sf)}
.code{font:700 30px "Barlow Condensed",sans-serif;letter-spacing:4px}
#dlg{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
#dlg[hidden]{display:none}#dlg .card{max-width:440px;width:100%;margin:0;max-height:90vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
details summary{cursor:pointer;font-weight:600}
svg text{font-family:"Barlow",sans-serif}
.center{max-width:420px;margin:30px auto}
</style>
</head>
<body>
<header><div class="brand"><img src="logo.png" alt="DGXA"><span id="hd">Suivi des jeunes</span></div><div id="hbtn"></div></header>
<main id="app"><div class="empty">Chargement…</div></main>
<div id="dlg" hidden role="dialog" aria-modal="true"><div class="card" id="dlgc"></div></div>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script>
/* ================= CONFIG ================= */
const SB_URL="https://yalbwkkdsznvlsrlelxc.supabase.co",SB_KEY="sb_publishable_qnZQYhe-KUisPy324Ha_DA_kkt_MJ5C";
const APP_URL=location.origin+location.pathname;

/* ================= OUTILS ================= */
const $=s=>document.querySelector(s),app=$("#app");
const esc=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const days=d=>d?Math.floor((Date.parse(today())-Date.parse(String(d).slice(0,10)))/864e5):null;
const fmt=d=>d?new Date(String(d).slice(0,10)+"T00:00:00Z").toLocaleDateString("fr-FR",{day:"numeric",month:"short",timeZone:"UTC"}):"—";
const fmtY=d=>d?new Date(String(d).slice(0,10)+"T00:00:00Z").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"}):"—";
const ago=d=>{const n=days(d);return n==null?"jamais":n<=0?"aujourd’hui":n===1?"hier":"il y a "+n+" j"};
const wk=d=>{const x=new Date(d+"T00:00:00Z");x.setUTCDate(x.getUTCDate()-(x.getUTCDay()+6)%7);return x.toISOString().slice(0,10)};
const f1=n=>n==null||isNaN(n)?"—":(Math.round(n*10)/10).toString().replace(".",",");
const avg=a=>{a=a.filter(x=>x!=null);return a.length?a.reduce((s,x)=>s+x,0)/a.length:null};
const age=b=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(b||""))return null;const t=today();let a=+t.slice(0,4)-+b.slice(0,4);if(t.slice(5)<b.slice(5))a--;return a};
const uuid=()=>crypto.randomUUID?crypto.randomUUID():"10000000-1000-4000-8000-100000000000".replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
const ini=n=>String(n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const waNum=t=>{let d=String(t||"").replace(/[^\d+]/g,"");if(d.startsWith("+"))d=d.slice(1);else if(d.startsWith("00"))d=d.slice(2);else if(/^0\d{9}$/.test(d))d="212"+d.slice(1);return d.length>=8?d:""};
const normCode=c=>String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2200)}
async function copy(txt){try{await navigator.clipboard.writeText(txt);return true}catch(e){return false}}
function dlg(html){$("#dlgc").innerHTML=html;$("#dlg").hidden=false}
function closeDlg(){$("#dlg").hidden=true}
function ask(msg,yes="Confirmer"){return new Promise(res=>{dlg(`<p style="margin:0 0 16px;font-weight:600">${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="g" id="dn">Annuler</button><button class="b" id="dy">${esc(yes)}</button></div>`);
  $("#dn").onclick=()=>{closeDlg();res(false)};$("#dy").onclick=()=>{closeDlg();res(true)}})}
$("#dlg").addEventListener("click",e=>{if(e.target.id==="dlg")closeDlg()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#dlg").hidden)closeDlg()});

/* ================= RÉFÉRENTIELS ================= */
const GW={feel:["","Très mauvais","Mauvais","Moyen","Bon","Très bon"],form:["","Épuisé","Fatigué","Correct","En forme","Au top"],moral:["","Très bas","Bas","Moyen","Bon","Excellent"]};
const GL={feel:"Ressenti du match",form:"Forme physique",moral:"Moral"};
const GS={feel:"Ressenti",form:"Forme",moral:"Moral"};
const GE={feel:["","😞","😕","😐","🙂","😄"],form:["","🪫","😮‍💨","👌","💪","⚡"],moral:["","😢","😔","😐","😊","🔥"]};
const INJE=["✅","⚠️","🚑"];
const INJ=["Rien","Gêne","Blessé"];
const ZONES=["Cheville","Pied","Genou","Mollet","Cuisse / ischios","Hanche / aine","Dos","Épaule","Tête","Autre"];
const ROLES=["Titulaire","Remplaçant","Non utilisé","Hors groupe"];
const POSTES=["","Gardien","Défenseur central","Latéral","Milieu défensif","Milieu","Milieu offensif","Ailier","Attaquant"];
const PIEDS=["","Droit","Gauche","Les deux"];
const gaugeRow=(k,v)=>`<span class="mut">${GS[k]}</span><span class="emo" role="img" aria-label="${v?GW[k][v]+", "+v+" sur 5":"non renseigné"}">${v?GE[k][v]:"·"}</span><span>${v?esc(GW[k][v]):'<span class="mut">—</span>'}</span>`;
const gaugeIn=(k,v)=>`<div class="gin" data-g="${k}"><div class="lab"><b>${GL[k]}</b><span id="gw-${k}" style="font-weight:600">${v?GW[k][v]:'<span class="mut">Choisis</span>'}</span></div><div class="dots${v?" has":""}" role="radiogroup" aria-label="${GL[k]}">${[1,2,3,4,5].map(i=>`<button type="button" role="radio" aria-checked="${v===i}" data-gv="${i}" class="${v===i?"on":""}" aria-label="${GW[k][i]}" title="${GW[k][i]}">${GE[k][i]}</button>`).join("")}</div><input type="hidden" id="g-${k}" value="${v||""}"></div>`;
const injTag=e=>e.inj?`<span class="tag hi">${INJE[e.inj]} ${e.inj===2?"Blessé":"Gêne"}${e.zone?" · "+esc(e.zone):""}</span>`:"";
const kindLbl=e=>e.kind==="entrainement"?"🏃 Entraînement":"⚽ Match"+(e.opp?" · "+esc(e.opp):"");

function contractAlert(p,A){const f=(p.info||{}).fin_contrat;if(!/^\d{4}-\d{2}-\d{2}$/.test(f||""))return;const d=-days(f);
  if(d<0)A.push(["hi","📄 Contrat terminé"]);else if(d<=90)A.push(["hi","📄 Fin de contrat dans "+d+" j"]);else if(d<=182)A.push(["mid","📄 Fin de contrat dans "+Math.round(d/30)+" mois"])}
function alertsFor(p,E){
  const A=[],e=E[0],e2=E[1];contractAlert(p,A);
  if(!E.length){A.push(["mid",p.last_seen?"📭 Aucune saisie":"✉️ Lien pas encore ouvert"]);return A}
  if(e.inj)A.push(["hi",INJE[e.inj]+" "+(e.inj===2?"Blessé":"Gêne")+(e.zone?" : "+e.zone.toLowerCase():"")]);
  else if(e2&&e2.inj&&days(e2.date)<14)A.push(["mid","⚠️ Gêne récente"]);
  if(e.form===1)A.push(["hi","🪫 Épuisé"]);else if(e2&&e.form&&e2.form&&e.form<=2&&e2.form<=2)A.push(["mid","😮‍💨 Fatigue (2 saisies)"]);
  if(e.moral===1)A.push(["hi","😢 Moral très bas"]);else if(e2&&e.moral&&e2.moral&&e.moral<=2&&e2.moral<=2)A.push(["mid","😔 Moral bas (2 saisies)"]);
  const M=E.filter(x=>x.kind!=="entrainement");
  if(M.length>1&&M[0].feel&&M[1].feel&&M[0].feel<=2&&M[1].feel<=2)A.push(["mid","😕 Ressenti bas (2 matchs)"]);
  const since=days(e.date);if(since>10)A.push(["mid","⏰ Rien depuis "+since+" j"]);
  const m28=M.filter(x=>days(x.date)<28);if(m28.length&&m28.reduce((s,x)=>s+x.min,0)<90)A.push(["mid","⏱️ Peu de temps de jeu"]);
  return A}
const tags=A=>A.map(a=>`<span class="tag ${a[0]==="hi"?"hi":""}">${esc(a[1])}</span>`).join("")||'<span class="tag ok">👍 RAS</span>';

/* ================= GRAPHIQUES ================= */
function barChart(E){
  const W=[];for(let i=7;i>=0;i--)W.push(new Date(Date.parse(wk(today()))-i*7*864e5).toISOString().slice(0,10));
  const by={};E.filter(x=>x.kind!=="entrainement").forEach(x=>{const k=wk(x.date);by[k]=(by[k]||0)+x.min});
  const v=W.map(k=>by[k]||0),mx=Math.max(90,...v),bw=70;
  return`<svg viewBox="0 0 560 140" style="width:100%;height:auto" role="img" aria-label="Minutes jouées par semaine">${v.map((x,i)=>{const h=x/mx*96;return`<rect x="${i*bw+12}" y="${116-h}" width="${bw-24}" height="${Math.max(h,x?2:0)}" rx="4" fill="currentColor"/><text x="${i*bw+bw/2}" y="${110-h}" text-anchor="middle" font-size="12" fill="currentColor">${x||""}</text><text x="${i*bw+bw/2}" y="134" text-anchor="middle" font-size="11" fill="currentColor" opacity=".55">${fmt(W[i])}</text>`}).join("")}</svg>`}
function lineChart(E){
  const L=E.filter(x=>x.form||x.moral).slice(0,12).reverse();if(L.length<2)return'<p class="mut sm">Pas encore assez de saisies pour afficher l’évolution.</p>';
  const w=560,h=150,px=i=>36+i*(w-56)/(L.length-1),py=v=>120-(v-1)*25;
  const path=k=>{let d="",on=false;L.forEach((x,i)=>{if(x[k]){d+=(on?"L":"M")+px(i)+" "+py(x[k]);on=true}});return d};
  const dots=(k,f)=>L.map((x,i)=>x[k]?`<circle cx="${px(i)}" cy="${py(x[k])}" r="4" fill="${f?"currentColor":"var(--sf)"}" stroke="currentColor" stroke-width="2"/>`:"").join("");
  return`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" aria-label="Évolution de la forme et du moral">
  ${[1,2,3,4,5].map(v=>`<line x1="24" x2="${w-14}" y1="${py(v)}" y2="${py(v)}" stroke="currentColor" opacity=".1"/><text x="2" y="${py(v)+5}" font-size="13">${GE.form[v]}</text>`).join("")}
  <path d="${path("form")}" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="${path("moral")}" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 5"/>
  ${dots("form",1)}${dots("moral",0)}${L.map((x,i)=>i%Math.ceil(L.length/6)===0||i===L.length-1?`<text x="${px(i)}" y="${h-4}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".55">${fmt(x.date)}</text>`:"").join("")}</svg>
  <p class="sm mut" style="margin:4px 0 0">━━ Forme physique &nbsp;&nbsp; ╍╍ Moral &nbsp;· de 🪫 (très bas) à ⚡ (au top)</p>`}

/* ================= SUPABASE ================= */
let sb=null;try{if(window.supabase&&!SB_URL.startsWith("__"))sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,detectSessionInUrl:true,autoRefreshToken:true}})}catch(e){console.error(e)}
const isNetErr=e=>!navigator.onLine||/fetch|network|Failed|Load failed|timeout/i.test(String(e&&(e.message||e)));

/* ================= ÉTAT LOCAL ================= */
const K="dgxa-v2";let L={};try{L=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
L.queue=L.queue||[];
const save=()=>{try{localStorage.setItem(K,JSON.stringify(L))}catch(e){}};
let MODE=null,V={}; // vue courante

/* ================= INSTALLATION ================= */
let INST=null;const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();INST=e;if(MODE==="player")render()});
if("serviceWorker" in navigator&&location.protocol==="https:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
const installCard=()=>standalone?"":INST?`<div class="card row" style="align-items:center;justify-content:space-between"><span><b>Installe l’appli</b> <span class="mut">pour l’ouvrir depuis ton écran d’accueil.</span></span><button class="b" data-act="install">Installer</button></div>`
  :isIOS?`<div class="card"><details><summary>Ajouter l’appli à l’écran d’accueil</summary><p class="mut sm" style="margin:6px 0 0">Dans Safari : bouton Partager, puis « Sur l’écran d’accueil ». Garde ton code joueur : il te sera demandé à la première ouverture.</p></details></div>`:"";

/* ================= DÉMARRAGE ================= */
const H=new URLSearchParams(location.hash.slice(1));

async function boot(){
  if(AUTHERR){MODE="login";V.lerr=AUTHERR;return render()}
  if(AUTHFLOW){MODE="agency";const s=sb&&await sb.auth.getSession();if(!(s&&s.data&&s.data.session)){AUTHFLOW=null;MODE="login";V.lerr="Ce lien a expiré ou a déjà été utilisé. Entrez votre email ci-dessous puis cliquez sur « Mot de passe oublié ».";history.replaceState(null,"",location.pathname)}return render()}

  if(sb){const {data}=await sb.auth.getSession();if(data&&data.session){MODE="agency";return agencyLoad()}}
  if(L.code){MODE="player";render();return playerSync(true)}
  MODE=L.mode==="agency"?"login":"home";render()}

async function playerSync(load){
  if(!sb){V.pmsg="Connexion au serveur impossible pour le moment. Tes saisies sont gardées sur ce téléphone.";return render()}
  // envoie la file d'attente
  while(L.queue.length){const op=L.queue[0];
    try{const r=op.op==="save"?await sb.rpc("player_save_entry",{p_token:L.code,e:op.e}):op.op==="del"?await sb.rpc("player_delete_entry",{p_token:L.code,p_id:op.id}):await sb.rpc("player_save_self",{p_token:L.code,p_self:op.self,p_consent:op.consent});
      if(r.error){if(/code invalide/.test(r.error.message)){V.pbad=true;break}if(isNetErr(r.error))break;console.error(r.error);L.queue.shift();save();continue}
      L.queue.shift();save()}catch(e){break}}
  if(load||!L.cache){try{const r=await sb.rpc("player_get",{p_token:L.code});
      if(r.error)throw r.error;if(r.data===null){V.pbad=true}else{const pend=L.queue.filter(o=>o.op==="save").map(o=>o.e),del=L.queue.filter(o=>o.op==="del").map(o=>o.id);
        let E=(r.data.entries||[]).filter(e=>!del.includes(e.id));pend.forEach(p=>{const i=E.findIndex(x=>x.id===p.id);if(i>=0)E[i]=p;else E.unshift(p)});
        if($("#fd"))V.draft=readForm();
        L.cache={name:r.data.name,self:r.data.self||{},consent_at:r.data.consent_at||(L.cache&&L.cache.consent_at),entries:E};V.pbad=false;save()}}
    catch(e){if(!isNetErr(e))console.error(e)}}
  render()}

  if(tab==="resume")body=`<div class="kpis"><div class="kpi"><i>⏱️</i><b>${m7}</b><span>minutes (7 j)</span></div><div class="kpi"><i>🗓️</i><b>${m28.reduce((s,x)=>s+x.min,0)}</b><span>minutes (4 sem.)</span></div><div class="kpi"><i>⚽</i><b>${m28.length}</b><span>matchs (4 sem.)</span></div><div class="kpi"><i>${(x=>x?GE.form[Math.round(x)]:"💪")(avg(E28.map(x=>x.form)))}</i><b>${f1(avg(E28.map(x=>x.form)))}</b><span>forme moy. /5</span></div><div class="kpi"><i>${(x=>x?GE.moral[Math.round(x)]:"😊")(avg(E28.map(x=>x.moral)))}</i><b>${f1(avg(E28.map(x=>x.moral)))}</b><span>moral moy. /5</span></div></div>
   <div class="card"><h3 style="margin-bottom:8px">🕘 Dernière saisie</h3>${E[0]?`<b>${fmt(E[0].date)} · ${kindLbl(E[0])}</b> <span class="mut sm">${E[0].min?E[0].min+" min":""}</span><div class="gl" style="margin:8px 0">${E[0].kind!=="entrainement"?gaugeRow("feel",E[0].feel):""}${gaugeRow("form",E[0].form)}${gaugeRow("moral",E[0].moral)}</div>${injTag(E[0])}${E[0].note?`<p style="margin:6px 0 0">« ${esc(E[0].note)} »</p>`:""}`:'<p class="mut">Rien pour l’instant.</p>'}</div>
   <div class="card"><h3 style="margin-bottom:6px">📉 Forme et moral</h3>${lineChart(E)}</div>
   <div class="card"><h3>⏱️ Minutes jouées par semaine</h3>${barChart(E)}</div>`;
  if(tab==="fiche")body=`${FICHE.map(([t,F],i)=>`<div class="card"><h3 style="margin-bottom:12px">${t}</h3>${i===0?`<div class="row" style="align-items:center;margin-bottom:14px">${avatar(p,1)}<label class="g" style="cursor:pointer">Changer la photo<input type="file" id="photo" accept="image/*" hidden></label>${(p.info||{}).photo?'<button class="g sm" data-act="rmphoto">Retirer</button>':""}</div>`:""}
     <div class="fgrid">${F.map(fField).join("")}</div>${i===3?`<div style="margin-top:14px"><b>Historique des blessures signalées</b>${inj.length?inj.map(x=>`<div class="sm" style="margin-top:6px">${fmt(x.date)} ${new Date(x.date).getFullYear()} · ${injTag(x)}${x.note?" "+esc(x.note):""}</div>`).join(""):'<p class="mut sm" style="margin:4px 0 0">Aucune blessure signalée.</p>'}</div>`:""}</div>`).join("")}
     <p class="sm mut">Accord parental confirmé par le joueur : <b>${p.consent_at?fmtY(p.consent_at):"pas encore"}</b> · Dernière ouverture de l’appli : <b>${p.last_seen?ago(p.last_seen):"jamais"}</b></p>
     <div class="row" style="position:sticky;bottom:12px"><button class="b" data-act="fsave">Enregistrer la fiche</button><span id="fsm" class="sm" style="font-weight:600"></span></div>`;
  if(tab==="saisies")body=`<div class="card">${E.length?E.map(e=>`<div class="ent"><div><b>${fmt(e.date)} · ${kindLbl(e)}</b> <span class="sm mut">${[e.kind!=="entrainement"?e.role:"",e.min?e.min+" min":""].filter(Boolean).map(esc).join(" · ")}</span><div class="gl" style="margin-top:6px">${e.kind!=="entrainement"?gaugeRow("feel",e.feel):""}${gaugeRow("form",e.form)}${gaugeRow("moral",e.moral)}</div>${injTag(e)}${e.note?`<div class="sm" style="margin-top:4px">« ${esc(e.note)} »</div>`:""}</div><div><button class="g sm" data-edel="${e.id}">Supprimer</button></div></div>`).join(""):'<p class="mut">Aucune saisie.</p>'}</div>`;
  if(tab==="notes")body=`<div class="card"><textarea id="nt" placeholder="Ex. Échange avec le club, rendez-vous parents…"></textarea><div style="margin:10px 0 4px"><button class="b" data-act="note">Ajouter la note</button></div>
   ${N.map(n=>`<div class="ent"><div><span class="sm mut">${fmtY(n.created_at)} · ${esc(n.author||"?")}</span><div style="white-space:pre-wrap">${esc(n.text)}</div></div><button class="g sm" data-ndel="${n.id}">Supprimer</button></div>`).join("")||'<p class="mut">Aucune note.</p>'}</div>`;
  return`<div class="sp"><button class="g" data-act="back">← Tous les joueurs</button><div class="row"><button class="g" data-act="invite">Lien d’invitation</button></div></div>
  <div class="card"><div class="ph">${avatar(p,1)}<div class="grow"><h2>${esc(p.name)}</h2><div class="mut">${subLine(p)||"Fiche à compléter"}</div>${(p.info||{}).tel?`<div class="row" style="gap:6px;margin-top:8px"><a class="g sm" style="text-decoration:none" href="tel:${esc(p.info.tel.replace(/\s/g,""))}">📞 ${esc(p.info.tel)}</a>${waNum(p.info.tel)?`<a class="g sm" style="text-decoration:none" href="https://wa.me/${waNum(p.info.tel)}" target="_blank" rel="noopener">💬 WhatsApp</a>`:""}</div>`:""}<div style="margin-top:6px">${tags(A)}</div></div></div></div>
  <div class="tabs" role="tablist">${[["resume","📊 Résumé"],["fiche","🪪 Fiche"],["saisies","📋 Saisies ("+E.length+")"],["notes","📝 Notes ("+N.length+")"]].map(([k,l])=>`<button role="tab" data-tab="${k}" class="${tab===k?"on":""}">${l}</button>`).join("")}</div>${body}`}
function inviteDlg(p){const link=APP_URL+"#j="+p.token,msg=`Salut ${p.name.split(" ")[0]} ! Voici ton appli de suivi DGXA : ${link}\nOuvre le lien, puis ajoute l’appli à ton écran d’accueil. Ton code joueur : ${p.token}`;
  dlg(`<h3 style="margin-bottom:6px">Lien d’invitation · ${esc(p.name)}</h3><p class="mut sm" style="margin-top:0">Envoie ce lien au joueur. Il l’ouvre une fois et ses saisies arrivent directement ici.</p>
  <div class="code" style="margin:6px 0">${esc(p.token)}</div>${(p.info||{}).tel?`<p class="sm" style="margin:0 0 8px">📱 Envoi WhatsApp au ${esc(p.info.tel)}</p>`:`<p class="sm mut" style="margin:0 0 8px">Ajoute son numéro dans la fiche pour l’envoyer directement sur son WhatsApp.</p>`}<input readonly value="${esc(link)}" onfocus="this.select()">
  <div class="row" style="margin-top:12px"><a class="b" style="text-decoration:none" href="https://wa.me/${waNum((p.info||{}).tel)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Envoyer par WhatsApp</a><button class="g" id="cpl">Copier le message</button></div>
  <div class="row" style="margin-top:16px;justify-content:space-between"><button class="g sm" id="rgen">Changer le code</button><button class="g" onclick="closeDlg()">Fermer</button></div>`);
  $("#cpl").onclick=async()=>{toast(await copy(msg)?"Message copié":"Copiez le lien ci-dessus")};
  $("#rgen").onclick=async()=>{if(!await ask("Changer le code ? L’ancien lien ne fonctionnera plus pour ce joueur.","Changer"))return inviteDlg(p);
    const code=Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>"ABCDEFGHJKMNPQRSTUVWXYZ23456789"[b%31]).join("");
    const r=await sb.from("players").update({token:code}).eq("id",p.id).select().single();if(r.error)return toast("Erreur : "+r.error.message);Object.assign(p,r.data);inviteDlg(p)}}
function settingsDlg(){dlg(`<h3 style="margin-bottom:12px">Réglages</h3><label class="f">Mon prénom (signature des notes, filtre « Mes joueurs »)<input id="myn" value="${esc(L.me||"")}"></label>
  <p class="sm mut">Connecté : ${esc(V.email||"")}</p><p class="sm mut">Pour ajouter un associé, invitez son email depuis Supabase (Authentication › Users › Invite user).</p>
  <div class="row" style="justify-content:space-between;margin-top:14px"><button class="g" id="lo">Se déconnecter</button><button class="b" id="svs">Enregistrer</button></div>`);
  $("#svs").onclick=()=>{L.me=$("#myn").value.trim();save();closeDlg();render()};
  $("#lo").onclick=async()=>{await sb.auth.signOut();LOADED=false;MODE="login";closeDlg();render()}}
function resize(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const s=320,c=document.createElement("canvas"),r=Math.max(s/img.width,s/img.height);c.width=c.height=s;
  const x=c.getContext("2d");x.drawImage(img,(s-img.width*r)/2,(s-img.height*r)/2,img.width*r,img.height*r);res(c.toDataURL("image/jpeg",.78))};img.onerror=rej;img.src=URL.createObjectURL(file)})}

/* ================= RENDU ================= */
function render(){
  const hb=$("#hbtn");hb.innerHTML=MODE==="agency"&&LOADED?'<button data-act="reload" aria-label="Actualiser">Actualiser</button>':"";
  $("#hd").textContent=MODE==="agency"||MODE==="login"?"Agence":"Suivi des jeunes";
  app.innerHTML=MODE==="player"?playerView():MODE==="agency"?agencyView():MODE==="login"?loginView():homeView()}

/* ================= ACTIONS ================= */
document.addEventListener("click",async ev=>{
  const t=ev.target.closest("button,[data-pid]");if(!t||t.closest("#dlg"))return;const a=t.dataset.act,d=t.dataset;
  // jauges & segments (joueur)
  if(d.gv){const g=t.closest(".gin"),k=g.dataset.g,v=+d.gv;$("#g-"+k).value=v;g.querySelector(".dots").classList.add("has");g.querySelectorAll("button").forEach(b=>{const on=+b.dataset.gv===v;b.classList.toggle("on",on);b.setAttribute("aria-checked",on)});$("#gw-"+k).textContent=GW[k][v];if(navigator.vibrate)try{navigator.vibrate(8)}catch(e){}return}
  if(d.kind){V.draft=readForm();V.draft.kind=d.kind;if(d.kind==="match"&&!V.draft.role)V.draft.role="Titulaire";return render()}
  if(d.inj!=null){V.draft=readForm();V.draft.inj=+d.inj;if(!V.draft.inj)V.draft.zone="";return render()}
  if(d.pid){V.sel=d.pid;V.tab="resume";render();scrollTo(0,0);return}
  if(d.tab){if(V.dirty&&!await ask("Des modifications de la fiche ne sont pas enregistrées. Les abandonner ?","Abandonner"))return;V.dirty=false;V.tab=d.tab;return render()}
  if(d.pedit){V.edit=d.pedit;V.draft=null;render();$("#form").scrollIntoView({behavior:"smooth"});return}
  if(d.pdel){if(!await ask("Supprimer cette saisie ?","Supprimer"))return;L.cache.entries=L.cache.entries.filter(x=>x.id!==d.pdel);L.queue=L.queue.filter(o=>!(o.op==="save"&&o.e.id===d.pdel));L.queue.push({op:"del",id:d.pdel});save();render();return playerSync(false)}
  if(d.edel){if(!await ask("Supprimer cette saisie du joueur ?","Supprimer"))return;const r=await sb.from("entries").delete().eq("id",d.edel);if(r.error)return toast("Erreur : "+r.error.message);DB.entries=DB.entries.filter(x=>x.id!==d.edel);return render()}
  if(d.ndel){if(!await ask("Supprimer cette note ?","Supprimer"))return;const r=await sb.from("notes").delete().eq("id",d.ndel);if(r.error)return toast("Erreur : "+r.error.message);DB.notes=DB.notes.filter(x=>x.id!==d.ndel);return render()}
  switch(a){
  case"joincode":{const c=normCode($("#code").value);if(c.length<6){$("#cerr").textContent="Entre le code reçu de l’agence.";return}
    L.code=c;L.cache=null;L.queue=[];save();MODE="player";render();return playerSync(true)}
  case"tologin":L.mode="agency";save();MODE="login";return render();
  case"home":L.mode="";save();MODE="home";return render();
  case"pout":if(L.queue.length&&!await ask("Des saisies n’ont pas encore été envoyées et seront perdues. Continuer ?","Continuer"))return;L.code="";L.cache=null;L.queue=[];V={};save();MODE="home";return render();
  case"consent":{if(!$("#cons").checked){$("#perr").textContent="Il faut l’accord de ton parent ou tuteur pour continuer.";return}
    const self={poste:$("#sp").value,birth:$("#sb").value,pied:$("#spd").value};L.cache.self=self;L.cache.consent_at=new Date().toISOString();L.queue.push({op:"self",self,consent:true});save();render();return playerSync(false)}
  case"pself":{const self={poste:$("#sp").value,birth:$("#sb").value,pied:$("#spd").value};L.cache.self=self;L.queue.push({op:"self",self,consent:true});save();toast("Profil enregistré");return playerSync(false)}
  case"psave":{const f=readForm(),er=$("#ferr");
    if(!f.date){er.textContent="Indique la date.";return}
    const hasMin=f.kind==="entrainement"||f.role==="Titulaire"||f.role==="Remplaçant";
    if(f.kind==="match"&&hasMin&&(f.min==null||isNaN(f.min)||f.min<0||f.min>200)){er.textContent="Indique tes minutes jouées.";return}
    if(f.kind==="match"&&!f.feel){er.textContent="Choisis ton ressenti sur le match.";return}
    if(!f.form||!f.moral){er.textContent="Indique ta forme et ton moral.";return}
    if(f.inj&&!f.zone){er.textContent="Indique où tu as mal.";return}
    const e={id:V.edit||uuid(),kind:f.kind,date:f.date,opp:f.opp||"",role:f.role||"",min:hasMin?(f.min||0):0,feel:f.feel,form:f.form,moral:f.moral,inj:f.inj,zone:f.zone||"",note:f.note||""};
    const i=L.cache.entries.findIndex(x=>x.id===e.id);if(i>=0)L.cache.entries[i]=e;else L.cache.entries.unshift(e);
    L.queue=L.queue.filter(o=>!(o.op==="save"&&o.e.id===e.id));L.queue.push({op:"save",e});save();V.edit=null;V.draft=null;render();scrollTo(0,0);
    await playerSync(false);cheer(e,L.queue.some(o=>o.op==="save"&&o.e.id===e.id));return}
  case"pcancel":V.edit=null;V.draft=null;return render();
  case"install":if(INST){INST.prompt();try{await INST.userChoice}catch(e){}INST=null;render()}return;
  case"login":{const em=$("#le").value.trim(),pw=$("#lp").value;if(!sb){$("#lerr").textContent="Serveur injoignable. Vérifiez la connexion.";return}
    t.disabled=true;const r=await sb.auth.signInWithPassword({email:em,password:pw});t.disabled=false;
    if(r.error){$("#lerr").textContent=/Invalid login/i.test(r.error.message)?"Email ou mot de passe incorrect.":r.error.message;return}
    L.email=em;L.mode="agency";save();V.email=em;MODE="agency";render();return agencyLoad()}
  case"forgot":{const em=$("#le").value.trim();if(!em){$("#lerr").textContent="Entrez d’abord votre email.";return}
    const r=await sb.auth.resetPasswordForEmail(em,{redirectTo:APP_URL});$("#lerr").textContent=r.error?r.error.message:"Si ce compte existe, un email de réinitialisation a été envoyé.";return}
  case"setpw":{const p1=$("#np1").value,p2=$("#np2").value;if(p1.length<8){$("#perr").textContent="8 caractères minimum.";return}if(p1!==p2){$("#perr").textContent="Les deux mots de passe sont différents.";return}
    const r=await sb.auth.updateUser({password:p1});if(r.error){$("#perr").textContent=r.error.message;return}AUTHFLOW=null;history.replaceState(null,"",location.pathname);L.mode="agency";save();toast("Mot de passe enregistré");return agencyLoad()}
  case"reload":toast("Actualisation…");return agencyLoad();
  case"back":if(V.dirty&&!await ask("Des modifications de la fiche ne sont pas enregistrées. Les abandonner ?","Abandonner"))return;V.dirty=false;V.sel=null;return render();
  case"settings":{const s=await sb.auth.getSession();V.email=s.data.session&&s.data.session.user.email;return settingsDlg()}
  case"toggleArch":V.arch=!V.arch;return render();
  case"addp":dlg(`<h3 style="margin-bottom:12px">Nouveau joueur</h3><label class="f">Nom complet<input id="nn" autocomplete="off"></label><label class="f" style="margin-top:10px">Téléphone du joueur (WhatsApp)<input id="ntel" type="tel" inputmode="tel" placeholder="Ex. 06 12 34 56 78"></label><label class="f" style="margin-top:10px">Catégorie (facultatif)<input id="nc" placeholder="Ex. U17"></label><p id="nerr" class="sm" style="font-weight:600;min-height:18px"></p><div class="row" style="justify-content:flex-end"><button class="g" onclick="closeDlg()">Annuler</button><button class="b" id="nok">Créer et inviter</button></div>`);
    $("#nn").focus();$("#nok").onclick=async()=>{const n=$("#nn").value.trim();if(!n){$("#nerr").textContent="Indiquez le nom.";return}
      const r=await sb.from("players").insert({name:n,info:{categorie:$("#nc").value.trim(),tel:$("#ntel").value.trim(),resp:L.me||""}}).select().single();if(r.error){$("#nerr").textContent=r.error.message;return}
      DB.players.push(r.data);V.sel=r.data.id;V.tab="fiche";render();inviteDlg(r.data)};return;
  case"invite":return inviteDlg(DB.players.find(x=>x.id===V.sel));
  case"fsave":{const p=DB.players.find(x=>x.id===V.sel),info={...(p.info||{})};let name=p.name;
    document.querySelectorAll("[data-fk]").forEach(i=>{if(i.dataset.fk==="name")name=i.value.trim()||name;else info[i.dataset.fk]=i.value.trim()});
    const r=await sb.from("players").update({name,info,updated_at:new Date().toISOString()}).eq("id",p.id).select().single();if(r.error)return toast("Erreur : "+r.error.message);
    Object.assign(p,r.data);V.dirty=false;toast("Fiche enregistrée");return render()}
  case"rmphoto":{const p=DB.players.find(x=>x.id===V.sel),info={...p.info};delete info.photo;const r=await sb.from("players").update({info}).eq("id",p.id).select().single();if(!r.error)Object.assign(p,r.data);return render()}
  case"note":{const v=$("#nt").value.trim();if(!v)return;const r=await sb.from("notes").insert({player_id:V.sel,author:L.me||V.email||"",text:v}).select().single();if(r.error)return toast("Erreur : "+r.error.message);DB.notes.unshift(r.data);return render()}
  case"csv":{const rows=[["Joueur","Téléphone","Catégorie","Poste","Âge","Club","Responsable","Date","Type","Adversaire","Rôle","Minutes","Ressenti","Forme","Moral","Blessure","Zone","Commentaire"]];
    DB.entries.forEach(e=>{const p=DB.players.find(x=>x.id===e.player_id);if(!p)return;rows.push([p.name,pv(p,"tel"),pv(p,"categorie"),pv(p,"poste"),age(pv(p,"birth"))??"",pv(p,"club"),pv(p,"resp"),e.date,e.kind==="entrainement"?"Entraînement":"Match",e.opp,e.role,e.min,e.feel||"",e.form||"",e.moral||"",INJ[e.inj||0],e.zone,e.note])});
    const csv="﻿"+rows.map(r=>r.map(v=>{v=String(v==null?"":v);return/[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(";")).join("\r\n");
    const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));l.download="dgxa-saisies-"+today()+".csv";document.body.appendChild(l);l.click();l.remove();return}
  }
});
document.addEventListener("change",async ev=>{const i=ev.target;
  if(i.id==="fr"){V.draft=readForm();V.draft.role=i.value;return render()}
  if(i.id==="flt"){V.f=i.value;return render()}
  if(i.id==="srt"){V.sort=i.value;return render()}
  if(i.dataset&&i.dataset.fk){V.dirty=true;const m=$("#fsm");if(m)m.textContent="Modifications non enregistrées"}
  if(i.id==="photo"&&i.files[0]){try{const url=await resize(i.files[0]);const p=DB.players.find(x=>x.id===V.sel),info={...(p.info||{}),photo:url};
    const r=await sb.from("players").update({info}).eq("id",p.id).select().single();if(r.error)throw r.error;Object.assign(p,r.data);render()}catch(e){toast("Photo impossible : "+(e.message||e))}}
});
document.addEventListener("input",ev=>{if(ev.target.id==="q"){V.q=ev.target.value;const pos=ev.target.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(pos,pos)}});
document.addEventListener("keydown",ev=>{if(ev.key!=="Enter")return;const id=ev.target.id;if(id==="code")$("[data-act=joincode]").click();if(id==="lp")$("[data-act=login]").click()});
boot();
</script>
</body>
